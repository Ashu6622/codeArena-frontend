name: CI/CD Frontend UAT Auto Deployment

on:
  push:
    branches:
      - uat

jobs:
  quality-and-test:
    name: Run Quality Gate & Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test & Validate Frontend
        run: |
          npm ci
          npm run quality

  deploy-to-ec2:
    name: Deploy Frontend to EC2
    needs: quality-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=== 1. Pulling latest Frontend UAT branch ==="
            cd ~/codeArena-frontend
            git fetch origin
            git checkout uat
            git pull origin uat

            echo "=== 2. Building Frontend ==="
            npm install
            npm run build

            echo "=== 3. Restarting PM2 Frontend Service ==="
            pm2 restart codearena-frontend --update-env || pm2 restart ecosystem.config.js --update-env
            pm2 save

            echo "=== 4. Running Post-Deployment Health Check ==="
            sleep 5
            curl --fail --retry 3 --retry-delay 3 http://127.0.0.1:3000 || (echo "Frontend Health Check Failed!" && exit 1)

            echo "=== Frontend Deployment Successfully Completed! ==="

      - name: Send Email Notification (Success or Failure)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CodeArena Frontend UAT Deployment: ${{ job.status == 'success' && 'SUCCESS ✅' || 'FAILED ❌' }}"
          to: rashu2879@gmail.com
          from: CodeArena CI/CD <${{ secrets.MAIL_USERNAME }}>
          body: |
            Frontend Deployment Status: ${{ job.status == 'success' && 'SUCCESS ✅' || 'FAILED ❌' }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit SHA: ${{ github.sha }}
            Triggered By: ${{ github.actor }}

            Live Application: https://prepgo.in
